[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbexport"
version = "0.1.0"
description = "Export Jupyter Notebooks to LLM-friendly Python files."
authors = [{name = "Antigravity", email = "no-reply@gemini.com"}]
dependencies = [
    "watchdog>=3.0.0"
]
requires-python = ">=3.8"

[project.scripts]
nbexport = "nbexport.cli:main_export"
nbwatch = "nbexport.cli:main_watch"
