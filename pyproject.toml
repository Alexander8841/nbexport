[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbexport"
version = "0.2.0"
description = "Bidirectional 2-way sync between Jupyter Notebooks and LLM-friendly Python scripts with outputs."
authors = [{name = "Alexander", email = "no-reply@gemini.com"}]
dependencies = [
    "watchdog>=3.0.0"
]
requires-python = ">=3.8"

[project.scripts]
nbexport = "nbexport.cli:main_export"
nbimport = "nbexport.cli:main_import"
nbwatch = "nbexport.cli:main_watch"
